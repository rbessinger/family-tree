*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--paper)}
body{font-family:'EB Garamond',Georgia,serif;color:var(--ink);-webkit-print-color-adjust:exact;print-color-adjust:exact}
#page{position:relative;overflow:hidden;background:var(--paper)}
#frame1,#frame2{position:absolute;pointer-events:none;border:2px solid var(--line)}
#frame2{border-width:1px}
#stage{position:absolute;left:0;top:0;transform-origin:0 0}
svg{position:absolute;left:0;top:0;overflow:visible}
.bx{position:absolute;background:var(--card);border:1.4px solid var(--line);border-radius:9px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center}
.bx .bar{position:absolute;left:0;right:0;top:0;height:6px;background:var(--c)}
.bx.blood{background:color-mix(in srgb, var(--c) 13%, var(--card))}
.bx.spine{border:3px solid var(--c);box-shadow:0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent)}
.bx.spine .nm{color:color-mix(in srgb, var(--c) 70%, var(--ink))}
.bx .ph{border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;background:color-mix(in srgb, var(--c) 10%, #fff);border:1.5px dashed color-mix(in srgb, var(--c) 45%, #fff);color:color-mix(in srgb, var(--c) 55%, #fff);font-family:'Cormorant Garamond',serif;font-weight:700;overflow:hidden}
.bx .ph img{width:100%;height:100%;object-fit:cover}
.bx .tx{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:0 7px;flex:1}
.bx .nm{font-weight:600;line-height:1.08;white-space:nowrap}
.bx .sn{font-weight:500;line-height:1.08;white-space:nowrap}
.bx .yr{color:var(--muted);line-height:1.15;white-space:nowrap;margin-top:2px}
.bx .mk{font-family:'Inter',sans-serif;color:var(--q);font-size:.62em;vertical-align:.45em;margin-left:2px}
/* left-to-right pills */
.H .bx{flex-direction:row;justify-content:flex-start;text-align:left;border-radius:999px}
.H .bx .bar{top:0;bottom:0;left:0;right:auto;width:7px;height:auto}
.H .bx .tx{align-items:flex-start;padding:0 14px 0 12px}
.H .bx .ph{margin-left:5px}
.q{background:transparent!important;border:2px dashed var(--q)!important;color:var(--ink)}
.q .qm{font-family:'Cormorant Garamond',serif;font-weight:700;color:var(--q);line-height:1}
.q .qt{line-height:1.15;padding:0 8px}
.rl{position:absolute;font-family:'Inter',sans-serif;text-transform:uppercase;color:var(--muted);letter-spacing:.18em;line-height:1.3}
.hdr{position:absolute;left:0;right:0;text-align:center}
.hdr h1{font-family:'Cormorant Garamond',serif;font-weight:600;line-height:1;letter-spacing:.02em}
.hdr .sub{color:var(--muted)}
.hdr .occ{font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.5em;color:var(--muted)}
.lgd{position:absolute;display:flex;flex-wrap:wrap;align-items:center;column-gap:1.6em;row-gap:.4em;color:var(--ink)}
.lgd .k{display:flex;align-items:center;gap:.45em;white-space:nowrap}
.lgd .sw{display:inline-block;width:1.6em;height:.95em;border-radius:3px}
.draft{position:absolute;font-family:'Inter',sans-serif;text-transform:uppercase;letter-spacing:.3em;color:var(--q)}
.note{position:absolute;color:var(--muted);text-align:right;line-height:1.35}
.bx.hl{box-shadow:0 0 0 5px var(--hl),0 0 0 10px color-mix(in srgb, var(--hl) 30%, transparent)!important}
.callout{position:absolute;background:var(--card);border:3px solid var(--hl);border-radius:14px;padding:18px 22px;line-height:1.3}
.callout h3{font-family:'Cormorant Garamond',serif;font-weight:700;color:color-mix(in srgb, var(--hl) 75%, var(--ink));line-height:1.05;margin-bottom:8px}
.callout p{margin-top:7px}
.plabel{font-family:'EB Garamond';font-style:italic}
.bx.echo{border-style:dashed !important;background:var(--card);}
</style>
</head>
<body>

  const kids = e.kids.filter(k => byId[k]);
  if(!ps.length || !kids.length) return null;
  const pc = ps.length === 2 ? (Math.max(byId[ps[0]].b, byId[ps[1]].b) + Math.min(byId[ps[0]].b + byId[ps[0]].w, byId[ps[1]].b + byId[ps[1]].w)) / 2 : center(ps[0]);
  const kc = kids.map(center);
  const pcs = ps.map(center);
  const lo = Math.min(pc, ...pcs, ...kc), hi = Math.max(pc, ...pcs, ...kc);
  const pd = byId[ps[0]].d;
  const br = byId[kids[0]].branch;
  return {ps, pc, pcs, kc, lo, hi, pd, kids, dashed: e.dashed, probable: e.probable, color: colorOf(br), adjacent: ps.length === 2 && Math.abs(byId[ps[0]].b - byId[ps[1]].b) < BW * 1.6};
}).filter(Boolean);
const byGap = {};
fams.forEach(f => (byGap[f.pd] = byGap[f.pd] || []).push(f));
Object.values(byGap).forEach(list => {
  list.sort((a, b) => a.lo - b.lo);
  const levels = [];
  list.forEach(f => {
    let lv = 0;
    while(levels[lv] !== undefined && levels[lv] > f.lo - 10) lv++;
    levels[lv] = f.hi; f.lv = lv;
  });
  const n = Math.max(1, levels.length);
  list.forEach(f => f.busD = f.pd * pitch + BL + DG * (n === 1 ? 0.5 : 0.25 + 0.5 * f.lv / (n - 1)));
});
const P2 = (b, d) => horiz ? `${d},${LABEL + b}` : `${LABEL + b},${d}`;
fams.forEach(f => {
  // from the marriage mark (between spouses, mid-box) or the parent's bottom edge
  const startD = f.adjacent ? f.pd * pitch + BL / 2 + 4 : f.pd * pitch + BL;
  const sw = f.probable ? 3.4 : 2.4, dash = f.dashed ? ' stroke-dasharray="8 7"' : '';
  let d = f.adjacent || f.pcs.length < 2 ? `M${P2(f.pc, startD)} L${P2(f.pc, f.busD)}` : f.pcs.map(c => `M${P2(c, f.pd * pitch + BL)} L${P2(c, f.busD)}`).join(' ');
  d += ` M${P2(f.lo, f.busD)} L${P2(f.hi, f.busD)}`;
  f.kc.forEach(k => { d += ` M${P2(k, f.busD)} L${P2(k, (f.pd + 1) * pitch)}`; });
  L.push(`<path d="${d}" fill="none" stroke="${f.probable ? col.question : f.color}" stroke-width="${sw}" stroke-linecap="round"${dash}/>`);
});
// probable links
(C.probable_links || []).forEach(pl => {
  const a = byId[pl.child], b = byId[pl.parent];
  if(!a || !b){ warnings.push('probable link not drawn'); return; }
  const [ax, ay] = XY(a.b + a.w / 2, a.d * pitch), [bx, by] = XY(b.b + b.w / 2, b.d * pitch + BL);
  const p0 = horiz ? [a.d * pitch, LABEL + a.b + a.w / 2] : [ax, ay];
  const p1 = horiz ? [b.d * pitch + BL, LABEL + b.b + b.w / 2] : [bx, by];
  const k = horiz ? [(p0[0] + p1[0]) / 2, p0[1], (p0[0] + p1[0]) / 2, p1[1]] : [p0[0], (p0[1] + p1[1]) / 2, p1[0], (p0[1] + p1[1]) / 2];
  L.push(`<path d="M${p0[0]},${p0[1]} C${k[0]},${k[1]} ${k[2]},${k[3]} ${p1[0]},${p1[1]}" fill="none" stroke="${col.question}" stroke-width="3.2" stroke-dasharray="11 8"/>`);
  const mx = horiz ? p0[0] - (pl.label.length * 4.1 + 30) : p0[0], my = horiz ? p0[1] - 34 : p0[1] - 40;
  const tw = pl.label.length * 8.2 + 30;
  L.push(`<rect x="${mx - tw / 2}" y="${my - 17}" width="${tw}" height="32" rx="16" fill="${col.paper}" stroke="${col.question}" stroke-width="1.5"/><text class="plabel" x="${mx}" y="${my + 5}" text-anchor="middle" font-size="17" fill="${col.ink}">${esc(pl.label)}</text>`);
});
// highlight overlay: thick gold under the lines that join highlighted parent and child
const UNDER = [];
if(HL){
  fams.forEach(f => {
    const e = f;
    const hk = f.kids.filter(k => hlSet.has(k));
    const hp = f.ps.filter(x => hlSet.has(x));
    if(!hk.length || !hp.length) return;
    const pcx = f.adjacent || f.pcs.length < 2 ? f.pc : center(hp[0]);
    const startD = f.adjacent ? f.pd * pitch + BL / 2 : f.pd * pitch + BL;
    hk.forEach(k => {
      const kx = center(k);
      UNDER.push(`<path d="M${P2(pcx, startD)} L${P2(pcx, f.busD)} L${P2(kx, f.busD)} L${P2(kx, (f.pd + 1) * pitch)}" fill="none" stroke="${HL.color}" stroke-width="13" stroke-opacity=".45" stroke-linejoin="round" stroke-linecap="round"/>`);
    });
  });
}
// marriages drawn apart (spouses on different sides of the tree)
SEPS.forEach((m, i) => {
  const A = byId[m.a], B = byId[m.b];
  const laneD = (maxD * pitch + BL) + 90 + i * 40;
  const ax = center(m.a), bxx = center(m.b);
  const d = `M${P2(ax, A.d * pitch + BL)} L${P2(ax, laneD)} L${P2(bxx, laneD)} L${P2(bxx, B.d * pitch + BL)}`;
  const c = HL ? HL.color : col.ink;
  UNDER.push(`<path d="${d}" fill="none" stroke="${c}" stroke-width="13" stroke-opacity=".35" stroke-linejoin="round"/>`);
  L.push(`<path d="${d}" fill="none" stroke="${col.ink}" stroke-width="2.2" stroke-linejoin="round" transform="translate(0,-3)"/><path d="${d}" fill="none" stroke="${col.ink}" stroke-width="2.2" stroke-linejoin="round" transform="translate(0,3)"/>`);
  const mx = (ax + bxx) / 2;
  const tw = m.label.length * 10.5 + 40;
  const [tx, ty] = horiz ? [laneD + tw / 2 + 24, LABEL + mx] : [LABEL + mx, laneD];
  L.push(`<rect x="${tx - tw / 2}" y="${ty - 22}" width="${tw}" height="44" rx="22" fill="${col.paper}" stroke="${c}" stroke-width="2.5"/><text class="plabel" x="${tx}" y="${ty + 8}" text-anchor="middle" font-size="23" fill="${col.ink}">${esc(m.label)}</text>`);
});
// probable-child label next to the dashed line
(C.probable_children || []).forEach(pc => {
  const b = byId[pc.child]; if(!b) return;
  const x = horiz ? b.d * pitch - DG * 0.5 : LABEL + b.b + b.w / 2, y = horiz ? LABEL + b.b + b.w / 2 - 34 : b.d * pitch - DG * 0.42;
  const tw = pc.label.length * 8.6 + 26;
  L.push(`<rect x="${x - tw / 2}" y="${y - 15}" width="${tw}" height="30" rx="15" fill="${col.paper}" stroke="${col.question}" stroke-width="1.5" stroke-dasharray="5 4"/><text class="plabel" x="${x}" y="${y + 6}" text-anchor="middle" font-size="17" fill="${col.ink}">${esc(pc.label)}</text>`);
});
svg.setAttribute('width', contentW); svg.setAttribute('height', contentH);
svg.innerHTML = UNDER.join('') + L.join('');

if(HL){
  const anchorId = (C.probable_children || [])[0] ? C.probable_children[0].child : HL.people[0];
  const ab = byId[anchorId];
  const co = document.createElement('div'); co.className = 'callout';
  const cw = 1100;
  co.style.width = cw + 'px';
  let cx = LABEL + (ab ? ab.b + ab.w / 2 : 0) - cw / 2;
  cx = Math.max(LABEL, Math.min(cx, contentW - cw));
  if(horiz){ co.style.left = (maxD * pitch + BL + 90) + 'px'; co.style.top = (LABEL + 120) + 'px'; } else { co.style.left = cx + 'px'; co.style.top = (maxD * pitch + BL + 190) + 'px'; }
  co.innerHTML = `<h3 style="font-size:40px">${esc(HL.title)}</h3>` + HL.text.map(t => `<p style="font-size:22px">${esc(t)}</p>`).join('');
  stage.appendChild(co);
  if(horiz && LAY.missing.length){
    const c2 = document.createElement('div'); c2.className = 'callout';
    c2.style.width = cw + 'px'; c2.style.left = co.style.left; c2.style.top = (LABEL + 120 + 360) + 'px';
    c2.innerHTML = `<h3 style="font-size:34px">Also in the tree</h3><p style="font-size:22px">Not yet linked to a family: ${esc(LAY.missing.join(', '))}.</p>`;
    stage.appendChild(c2);
  }
}
// ---------- generation labels ----------
for(let d = 0; d <= maxD; d++){
  const g = d + LAY.depth0;
  const lab = g === 0 ? (C.row_label_zero || 'Ross & Carly') : (C.row_labels[-g - 1] || '');
  const e = document.createElement('div'); e.className = 'rl';
  e.style.fontSize = LC.label_font + 'px';
  if(horiz){ e.style.left = (d * pitch) + 'px'; e.style.top = '0px'; e.style.width = BL + 'px'; e.style.textAlign = 'center'; }
  else { e.style.left = '0px'; e.style.top = (d * pitch + BL / 2 - LC.label_font) + 'px'; e.style.width = (LABEL - 30) + 'px'; e.style.textAlign = 'right'; }
  e.innerHTML = esc(lab);
  stage.appendChild(e);
}

// ---------- page furniture (page units, not scaled) ----------
const HDR = C.page.header_in * IN, FTR = C.page.footer_in * IN;
const hdr = document.createElement('div'); hdr.className = 'hdr';
const hs = C.page.header_in;
hdr.style.top = (M * 0.55) + 'px';
hdr.innerHTML = `<h1 style="font-size:${hs * 46}px">${esc(C.title)}</h1><div class="sub" style="font-size:${hs * 11}px;margin-top:${hs * 4}px">${esc(C.subtitle)}</div><div class="occ" style="font-size:${hs * 6}px;margin-top:${hs * 7}px">${esc(C.occasion)}</div>`;
page.appendChild(hdr);
const lg = document.createElement('div'); lg.className = 'lgd';
const fs = C.page.footer_in * 13;
lg.style.fontSize = fs + 'px'; lg.style.left = M + 'px'; lg.style.bottom = (M * 0.7) + 'px'; lg.style.maxWidth = (W * 0.62) + 'px';
const sw = c => `<span class="sw" style="background:${c}"></span>`;
let keys = mode === 'two-sides'
  ? [[col.left_accent, C.left_label], [col.right_accent, C.right_label]]
  : C.branch_legend.map(([k, label]) => [BR[k], label]);
lg.innerHTML = keys.map(([c, t]) => `<span class="k">${sw(c)}${esc(t)}</span>`).join('') +
  `<span class="k"><span class="sw" style="background:color-mix(in srgb, ${col.ink} 13%, ${col.card});border:1px solid ${col.card_border}"></span>blood relative</span>` +
  `<span class="k"><span class="sw" style="background:${col.card};border:1px solid ${col.card_border}"></span>married in</span>` +
  `<span class="k"><span class="sw" style="border:3px solid ${col.ink};background:none"></span>direct line to Ross &amp; Carly</span>` +
  `<span class="k"><span style="font-weight:700">=</span>&nbsp;married</span>` +
  `<span class="k"><span class="sw" style="border:2px dashed ${col.question};background:none"></span>open question</span>` +
  `<span class="k"><span class="mk" style="color:${col.question}">◇</span>&nbsp;${esc(C.family_account_note)}</span>` +
  `<span class="k"><span class="mk" style="color:${col.question}">¹</span>&nbsp;${esc(C.single_source_note)}</span>`;
page.appendChild(lg);
const nt = document.createElement('div'); nt.className = 'note';
nt.style.fontSize = (fs * 0.92) + 'px'; nt.style.right = M + 'px'; nt.style.bottom = (M * 0.7) + 'px'; nt.style.width = (W * 0.3) + 'px';
nt.innerHTML = `${esc(C.footer_note)}<br>${esc(C._source_name)} · ${C._count} people in the tree`;
page.appendChild(nt);
if(C.draft_label){ const dl = document.createElement('div'); dl.className = 'draft'; dl.textContent = C.draft_label; dl.style.fontSize = (fs * 0.8) + 'px'; dl.style.left = M + 'px'; dl.style.top = (M * 0.6) + 'px'; page.appendChild(dl); }

// ---------- fit names, then scale the stage into the page ----------
document.fonts.ready.then(() => {
  document.querySelectorAll('.bx .tx').forEach(tx => {
    const lines = tx.querySelectorAll('.nm,.sn,.yr,.qt');
    let guard = 0;
    while(guard++ < 30 && [...lines].some(l => l.scrollWidth > tx.clientWidth - 6 || tx.scrollHeight > tx.clientHeight + 1)){
      lines.forEach(l => { l.style.fontSize = (parseFloat(getComputedStyle(l).fontSize) * 0.95) + 'px'; });
    }
  });
  const availW = W - 2 * M, availH = H - M - HDR - FTR - M * 0.3 - 0.4 * IN;
  const s = Math.min(availW / contentW, availH / contentH);
  const ox = M + (availW - contentW * s) / 2, oy = HDR + 0.4 * IN + (availH - contentH * s) / 2;
  stage.style.width = contentW + 'px'; stage.style.height = contentH + 'px';
  stage.style.transform = `translate(${ox}px,${oy}px) scale(${s})`;
  const namePt = LC.name_font * s * 0.75;
  warnings.push(`scale ${(s * 100).toFixed(0)}%: names print at about ${namePt.toFixed(1)} pt`);
  if(LAY.missing.length) warnings.push('not shown: ' + LAY.missing.join(', '));
  warnings.push(`content ${(contentW/96).toFixed(0)} x ${(contentH/96).toFixed(0)} in at 100%`);
  // overlap check
  const bs = LAY.boxes.map(b => { const r = b.el.getBoundingClientRect(); return [r.left, r.top, r.right, r.bottom]; });
  let ov = 0;
  for(let i = 0; i < bs.length; i++) for(let j = i + 1; j < bs.length; j++){
    const a = bs[i], b = bs[j];
    if(a[0] < b[2] - 1 && b[0] < a[2] - 1 && a[1] < b[3] - 1 && b[1] < a[3] - 1) ov++;
  }
  if(ov) warnings.push(ov + ' box overlaps');
  window.__warnings = warnings; window.__layoutDone = true;
});
</script>
</body>
